<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <!-- 1. Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. Firebase SDKs (v8) REMOVED -->
    <!-- We will now load them using import in the module script -->

    <!-- 3. Set up the Inter font family -->
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Header -->
    <div class="bg-white shadow-md">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-gray-800">Thank You Admin</h1>
            <button id="sign-out-button" class="hidden bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition-colors">
                Sign Out
            </button>
        </nav>
    </div>

    <!-- Login Form (Initially Shown) -->
    <div id="login-section" class="container mx-auto max-w-md mt-12 p-8 bg-white rounded-2xl shadow-xl">
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Admin Login</h2>
        <form id="login-form" class="space-y-4">
            <div>
                <label for="login-email" class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" id="login-email" required class="w-full p-3 mt-1 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label for="login-password" class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="login-password" required class="w-full p-3 mt-1 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded-lg font-semibold hover:bg-blue-700 transition-colors">
                Sign In
            </button>
            <p id="login-error" class="text-red-500 text-sm mt-2"></p>
        </form>
    </div>

    <!-- Admin Content (Initially Hidden) -->
    <div id="admin-content" class="hidden container mx-auto mt-12 grid grid-cols-1 lg:grid-cols-3 gap-8 px-6">
        
        <!-- Column 1: Add Attendee -->
        <div class="lg:col-span-1 p-8 bg-white rounded-2xl shadow-xl">
            <!-- UPDATED: Added id="form-title" -->
            <h2 id="form-title" class="text-2xl font-bold text-gray-800 mb-6">Add/Update Attendee</h2>
            <form id="add-attendee-form" class="space-y-4">
                <div>
                    <label for="attendee-name" class="block text-sm font-medium text-gray-700">Attendee Name</label>
                    <input type="text" id="attendee-name" placeholder="John Doe" required class="w-full p-3 mt-1 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-gray-100 disabled:text-gray-500">
                </div>
                <div>
                    <label for="attendee-message" class="block text-sm font-medium text-gray-700">Thank You Message</label>
                    <textarea id="attendee-message" rows="4" placeholder="Thanks for coming!" required class="w-full p-3 mt-1 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>
                <div>
                    <label for="attendee-image-url" class="block text-sm font-medium text-gray-700">Image URL (Optional)</label>
                    <input type="url" id="attendee-image-url" placeholder="https://..." class="w-full p-3 mt-1 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <!-- UPDATED: Added button wrapper and Cancel button -->
                <div class="flex space-x-2">
                    <button type="submit" class="w-full bg-green-600 text-white p-3 rounded-lg font-semibold hover:bg-green-700 transition-colors">
                        Add / Update
                    </button>
                    <button type="button" id="cancel-edit-button" class="hidden w-1/3 bg-gray-500 text-white p-3 rounded-lg font-semibold hover:bg-gray-600 transition-colors">
                        Cancel
                    </button>
                </div>
                <p id="add-attendee-success" class="text-green-600 text-sm mt-2"></p>
            </form>
        </div>

        <!-- Column 2: Stats -->
        <div class="lg:col-span-2 p-8 bg-white rounded-2xl shadow-xl space-y-6">
            <div>
                <h2 class="text-2xl font-bold text-gray-800 mb-4">Feedback Stats</h2>
                <!-- UPDATED: Wrapped buttons in a flex container -->
                <div class="flex space-x-2 mb-4">
                    <button id="refresh-stats-button" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition-colors">
                        Refresh Stats
                    </button>
                    <!-- NEW: Reset Stats Button -->
                    <button id="reset-stats-button" class="bg-red-500 text-white px-4 py-2 rounded-lg hover:bg-red-600 transition-colors">
                        Reset Stats
                    </button>
                </div>
                <div class="flex space-x-8">
                    <div class="text-center">
                        <span class="text-6xl">👍</span>
                        <p id="thumbs-up-count" class="text-4xl font-bold text-gray-800">0</p>
                        <p class="text-gray-600">Thumbs Up</p>
                    </div>
                    <div class="text-center">
                        <span class="text-6xl">👎</span>
                        <p id="thumbs-down-count" class="text-4xl font-bold text-gray-800">0</p>
                        <p class="text-gray-600">Thumbs Down</p>
                    </div>
                </div>
            </div>

            <!-- Current Attendees List -->
            <div>
                <h2 class="text-2xl font-bold text-gray-800 mb-4">Current Attendees</h2>
                <div id="attendee-list" class="max-h-96 overflow-y-auto border border-gray-200 rounded-lg p-4 space-y-2">
                    <!-- List will be populated by JS -->
                    <p class="text-gray-500">Loading attendees...</p>
                </div>
            </div>
        </div>

    </div>

    <!-- NEW: Delete Confirmation Modal -->
    <div id="delete-modal" class="hidden fixed inset-0 z-50 bg-black bg-opacity-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl p-8 max-w-sm w-full">
            <h3 class="text-xl font-bold text-gray-800 mb-4">Confirm Deletion</h3>
            <p id="delete-modal-message" class="text-gray-600 mb-6">Are you sure you want to delete this attendee?</p>
            <div class="flex justify-end space-x-3">
                <button id="delete-modal-cancel" class="bg-gray-500 text-white px-4 py-2 rounded-lg hover:bg-gray-600 transition-colors">
                    Cancel
                </button>
                <button id="delete-modal-confirm" class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 transition-colors">
                    Delete
                </button>
            </div>
        </div>
    </div>


    <!-- NEW: Use type="module" to allow imports -->
    <script type="module">
        // Import all the functions we need from the v12 SDKs
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            signOut, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            doc, 
            setDoc,
            getDoc, // NEW: Import getDoc
            deleteDoc, // NEW: Import deleteDoc
            getDocs, 
            query, 
            where, 
            onSnapshot 
        } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";


        // --- Firebase Configuration ---
        const firebaseConfig = {
            apiKey: "AIzaSyDNPF7SZ6L2vJ9L9RlYLHljy13bDPf-U00",
            authDomain: "hohs-thesis-thankyou.firebaseapp.com",
            projectId: "hohs-thesis-thankyou",
            storageBucket: "hohs-thesis-thankyou.firebasestorage.app",
            messagingSenderId: "470814353762",
            appId: "1:470814353762:web:c1ef4df38e33fb601ae43b"
        };

        // --- Modular Firebase Initialization ---
        let db;
        let auth;
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        auth = getAuth(app);


        // DOM Elements
        const loginSection = document.getElementById('login-section');
        const adminContent = document.getElementById('admin-content');
        const loginForm = document.getElementById('login-form');
        const loginError = document.getElementById('login-error');
        const signOutButton = document.getElementById('sign-out-button');
        const addAttendeeForm = document.getElementById('add-attendee-form');
        const addAttendeeSuccess = document.getElementById('add-attendee-success');
        const refreshStatsButton = document.getElementById('refresh-stats-button');
        const thumbsUpCount = document.getElementById('thumbs-up-count');
        const thumbsDownCount = document.getElementById('thumbs-down-count');
        const attendeeList = document.getElementById('attendee-list');

        // NEW: Form and Modal elements
        const formTitle = document.getElementById('form-title');
        const attendeeNameInput = document.getElementById('attendee-name');
        const attendeeMessageInput = document.getElementById('attendee-message');
        const attendeeImageInput = document.getElementById('attendee-image-url');
        const cancelEditButton = document.getElementById('cancel-edit-button');
        
        const deleteModal = document.getElementById('delete-modal');
        const deleteModalMessage = document.getElementById('delete-modal-message');
        const deleteModalCancel = document.getElementById('delete-modal-cancel');
        const deleteModalConfirm = document.getElementById('delete-modal-confirm');

        let attendeeToDelete = null; // State for delete modal

        document.addEventListener('DOMContentLoaded', () => {
            try {
                console.log("Admin Firebase Initialized");

                // --- REFACTORED: Listen for auth state changes ---
                onAuthStateChanged(auth, user => {
                    if (user) {
                        // User is logged in
                        loginSection.classList.add('hidden');
                        adminContent.classList.remove('hidden');
                        signOutButton.classList.remove('hidden');
                        
                        // Load initial data
                        loadAttendeeList();
                        fetchStats();
                    } else {
                        // User is logged out
                        loginSection.classList.remove('hidden');
                        adminContent.classList.add('hidden');
                        signOutButton.classList.add('hidden');
                    }
                });

                // Attach event listeners
                loginForm.addEventListener('submit', handleLogin);
                signOutButton.addEventListener('click', handleSignOut);
                addAttendeeForm.addEventListener('submit', handleAddAttendee);
                refreshStatsButton.addEventListener('click', fetchStats);

                // NEW: Listeners for edit/delete
                cancelEditButton.addEventListener('click', handleCancelEdit);
                deleteModalCancel.addEventListener('click', hideDeleteModal);
                deleteModalConfirm.addEventListener('click', confirmDelete); // This will be dynamic

                // NEW: Listener for Reset Stats
                const resetStatsButton = document.getElementById('reset-stats-button');
                resetStatsButton.addEventListener('click', handleResetStats);


            } catch (e) {
                console.error("Firebase initialization failed:", e.message); // Log the specific message
                if (e.message.includes("config") || e.message.includes("apiKey")) {
                    loginError.innerText = "Error: Firebase config is invalid.";
                } else {
                    loginError.innerText = "Error loading admin panel. Check console for details.";
                }
            }
        });

        // --- REFACTORED: Authentication ---
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-password').value;
            loginError.innerText = "";

            try {
                // v12: Pass auth as first argument
                await signInWithEmailAndPassword(auth, email, pass);
                // Auth listener will handle the UI change
            } catch (e) {
                console.error("Login failed:", e.code, e.message); 
                if (e.code === 'auth/invalid-credential' || e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found') {
                    loginError.innerText = "Error: Invalid email or password.";
                } else {
                    loginError.innerText = e.message;
                }
            }
        }

        async function handleSignOut() {
            try {
                // v12: Pass auth as first argument
                await signOut(auth);
                // Auth listener will handle the UI change
            } catch (e) {
                console.error("Sign out failed:", e);
            }
        }

        // --- REFACTORED: Add/Update Attendee ---
        async function handleAddAttendee(e) {
            e.preventDefault();
            const name = attendeeNameInput.value; // Use the element directly
            const msg = attendeeMessageInput.value;
            const img = attendeeImageInput.value;

            if (!name || !msg) return;

            addAttendeeSuccess.innerText = "Saving...";

            try {
                // v12: Use doc() and setDoc()
                // doc(db, collectionName, documentId)
                const attendeeRef = doc(db, "attendees", name);
                await setDoc(attendeeRef, {
                    msg: msg,
                    img: img
                });

                addAttendeeSuccess.innerText = `Successfully saved ${name}!`;
                
                // NEW: Reset form state
                handleCancelEdit(); 
                
                setTimeout(() => { addAttendeeSuccess.innerText = ""; }, 3000);
            } catch (e) {
                console.error("Error adding attendee:", e);
                addAttendeeSuccess.innerText = "Error. See console.";
            }
        }

        // --- NEW: Edit/Cancel Edit Functions ---
        // Needs to be on window to be called from innerHTML
        window.handleEdit = async (name) => {
            try {
                const docRef = doc(db, "attendees", name);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    attendeeNameInput.value = name;
                    attendeeMessageInput.value = data.msg;
                    attendeeImageInput.value = data.img || "";

                    // Update UI for editing
                    formTitle.innerText = "Editing: " + name;
                    attendeeNameInput.disabled = true; // Don't allow changing the name (ID)
                    cancelEditButton.classList.remove('hidden');

                    // Scroll to form
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    console.error("No document found to edit!");
                }
            } catch (e) {
                console.error("Error getting doc for edit:", e);
            }
        }

        function handleCancelEdit() {
            addAttendeeForm.reset();
            formTitle.innerText = "Add/Update Attendee";
            attendeeNameInput.disabled = false;
            cancelEditButton.classList.add('hidden');
        }

        // --- NEW: Delete Functions ---
        // Needs to be on window to be called from innerHTML
        window.handleDelete = (name) => {
            attendeeToDelete = name;
            deleteModalMessage.innerText = `Are you sure you want to delete "${name}"? This cannot be undone.`
            deleteModalConfirm.onclick = confirmDelete; // Set the confirm function
            deleteModal.classList.remove('hidden');
        }

        function hideDeleteModal() {
            attendeeToDelete = null;
            deleteModalConfirm.onclick = null; // Clear the confirm function
            deleteModal.classList.add('hidden');
        }

        async function confirmDelete() {
            if (!attendeeToDelete) return;

            try {
                const docRef = doc(db, "attendees", attendeeToDelete);
                await deleteDoc(docRef);
                console.log("Deleted:", attendeeToDelete);
                hideDeleteModal();
                // onSnapshot will handle the UI update
            } catch (e) {
                console.error("Error deleting document:", e);
                hideDeleteModal();
            }
        }

        // --- NEW: Reset Stats Functions ---
        function handleResetStats() {
            // Show the modal with a different message and confirm function
            deleteModalMessage.innerText = "Are you sure you want to delete ALL feedback data? This will reset counts to 0 and cannot be undone."
            deleteModalConfirm.onclick = confirmResetStats; // Set the *new* confirm function
            deleteModal.classList.remove('hidden');
        }

        async function confirmResetStats() {
            console.log("Resetting all feedback stats...");
            try {
                // Get all documents from the feedback collection
                const feedbackCollection = collection(db, "feedback");
                const snapshot = await getDocs(feedbackCollection);
                
                if (snapshot.empty) {
                    console.log("No feedback to delete.");
                    hideDeleteModal();
                    return;
                }
                
                // Create an array of delete promises
                const deletePromises = snapshot.docs.map(doc => deleteDoc(doc.ref));
                
                // Wait for all deletes to finish
                await Promise.all(deletePromises);
                
                console.log("All feedback deleted successfully.");
                
            } catch (e) {
                console.error("Error resetting stats:", e);
            }
            
            // Hide the modal and refresh the counts (which will now be 0)
            hideDeleteModal();
            fetchStats();
        }


        // --- REFACTORED: Feedback Stats ---
        async function fetchStats() {
            thumbsUpCount.innerText = "...";
            thumbsDownCount.innerText = "...";
            try {
                // v12: Use query(), where(), and getDocs()
                const upVotesQuery = query(collection(db, "feedback"), where("vote", "==", "up"));
                const downVotesQuery = query(collection(db, "feedback"), where("vote", "==", "down"));
                
                const upVotesSnapshot = await getDocs(upVotesQuery);
                const downVotesSnapshot = await getDocs(downVotesQuery);

                thumbsUpCount.innerText = upVotesSnapshot.size;
                thumbsDownCount.innerText = downVotesSnapshot.size;
            } catch (e) {
                console.error("Error fetching stats:", e.code, e.message); 
                if (e.code === 'permission-denied') {
                    thumbsUpCount.innerText = "N/A";
                    thumbsDownCount.innerText = "N/A";
                    attendeeList.innerHTML = "<p class='text-red-500'>Error: Permission denied. Did you update your Firestore rules?</p>";
                } else {
                    thumbsUpCount.innerText = "Err";
                    thumbsDownCount.innerText = "Err";
                }
            }
        }

        // --- REFACTORED: Attendee List ---
        function loadAttendeeList() {
            // v12: Use onSnapshot() and collection()
            const attendeesCollection = collection(db, "attendees");
            onSnapshot(attendeesCollection, snapshot => {
                if (snapshot.empty) {
                    attendeeList.innerHTML = "<p class='text-gray-500'>No attendees added yet.</p>";
                    return;
                }

                let html = "";
                // UPDATED: Added Edit/Delete buttons
                snapshot.forEach(doc => {
                    html += `
                        <div class="p-3 border-b border-gray-100 flex justify-between items-center">
                            <div>
                                <p class="font-semibold text-gray-800">${doc.id}</p>
                                <p class="text-sm text-gray-600 truncate" style="max-width: 300px;">${doc.data().msg}</p>
                            </div>
                            <div class="flex space-x-3 flex-shrink-0">
                                <button 
                                    onclick="window.handleEdit('${doc.id}')"
                                    class="text-blue-600 hover:underline text-sm font-medium">
                                    Edit
                                </button>
                                <button 
                                    onclick="window.handleDelete('${doc.id}')"
                                    class="text-red-600 hover:underline text-sm font-medium">
                                    Delete
                                </button>
                            </div>
                        </div>
                    `;
                });
                attendeeList.innerHTML = html;
            }, e => {
                console.error("Error loading attendee list:", e);
                attendeeList.innerHTML = "<p class='text-red-500'>Error loading list.</p>";
            });
        }

    </script>
</body>
</html>
